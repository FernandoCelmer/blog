[tool.poetry]
package-mode = false
name = "blog"
version = "0.1.0"
description = "Blog Fernando Celmer"
authors = ["FernandoCelmer <email@fernandocelmer.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
mkdocs = "^1.6.1"
mkdocs-simple-blog = "^0.4.3"
python-dotenv = "^1.0.0"
mkdocs-macros-plugin = "^1.5.0"
mkdocs-git-revision-date-localized-plugin = "^1.5.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
